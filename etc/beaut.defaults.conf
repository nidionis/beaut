# beaut protected defaults.
#
# DO NOT EDIT.  Operator settings belong in beaut.conf (or
# /etc/beaut/beaut.conf); that file is loaded after this one and may override
# any value below.
#
# This file owns identity, layout, protocol status/reason values, package
# kinds, route modes and other constants so the runtime and CLI stay free of
# magic numbers and duplicated literals.

# ---- identity ---------------------------------------------------------------
BEAUT_NAME="${BEAUT_NAME:-beaut}"
BEAUT_VERSION="${BEAUT_VERSION:-v1}"
BEAUT_PACKAGE_SCHEMA="${BEAUT_PACKAGE_SCHEMA:-beaut.package/1}"
BEAUT_SESSION_ID_PREFIX="${BEAUT_SESSION_ID_PREFIX:-s_}"
BEAUT_SESSION_ROUTE_PREFIX="${BEAUT_SESSION_ROUTE_PREFIX:-session-}"
BEAUT_SESSION_CONTAINER_PREFIX="${BEAUT_SESSION_CONTAINER_PREFIX:-${BEAUT_NAME}-}"
BEAUT_SNAPSHOT_IMAGE_PREFIX="${BEAUT_SNAPSHOT_IMAGE_PREFIX:-${BEAUT_NAME}-snap-}"

# ---- identity / layout ------------------------------------------------------
BEAUT_USER="${BEAUT_USER:-$BEAUT_NAME}"
BEAUT_GROUP="${BEAUT_GROUP:-$BEAUT_USER}"
BEAUT_HOME="${BEAUT_HOME:-/var/lib/$BEAUT_NAME}"
BEAUT_CONFIG_DIR="${BEAUT_CONFIG_DIR:-/etc/$BEAUT_NAME}"
BEAUT_STATE_DIR="${BEAUT_STATE_DIR:-${BEAUT_ROOT}/state}"
BEAUT_STORE_DIR="${BEAUT_STORE_DIR:-${BEAUT_ROOT}/store}"
BEAUT_LOG_DIR="${BEAUT_LOG_DIR:-${BEAUT_STATE_DIR}/logs}"
BEAUT_WWW_DIR="${BEAUT_WWW_DIR:-${BEAUT_ROOT}/www}"

# ---- install layout ---------------------------------------------------------
BEAUT_INSTALL_HOME="${BEAUT_INSTALL_HOME:-/var/lib/$BEAUT_NAME}"
BEAUT_INSTALL_CONFIG_DIR="${BEAUT_INSTALL_CONFIG_DIR:-/etc/$BEAUT_NAME}"
BEAUT_INSTALL_STATE_DIR="${BEAUT_INSTALL_STATE_DIR:-${BEAUT_INSTALL_HOME}/state}"
BEAUT_INSTALL_STORE_DIR="${BEAUT_INSTALL_STORE_DIR:-${BEAUT_INSTALL_HOME}/store}"
BEAUT_INSTALL_LOG_DIR="${BEAUT_INSTALL_LOG_DIR:-/var/log/$BEAUT_NAME}"
BEAUT_INSTALL_DEST="${BEAUT_INSTALL_DEST:-/usr/local/lib/$BEAUT_NAME}"
BEAUT_INSTALL_BIN="${BEAUT_INSTALL_BIN:-/usr/local/bin/$BEAUT_NAME}"
BEAUT_INSTALL_DEPS="${BEAUT_INSTALL_DEPS:-1}"
BEAUT_INSTALL_DOCKER="${BEAUT_INSTALL_DOCKER:-0}"
BEAUT_ENABLE_ROUTER="${BEAUT_ENABLE_ROUTER:-1}"

# ---- hub listener -----------------------------------------------------------
BEAUT_HUB_NAME="${BEAUT_HUB_NAME:-hub1}"
BEAUT_HUB_BIND="${BEAUT_HUB_BIND:-0.0.0.0}"
BEAUT_HUB_PORT="${BEAUT_HUB_PORT:-8080}"
BEAUT_HUB_URL="${BEAUT_HUB_URL:-http://127.0.0.1:${BEAUT_HUB_PORT}}"
BEAUT_HUB_DOMAIN="${BEAUT_HUB_DOMAIN:-localhost}"
# Address advertised to generated worker configs when BEAUT_PUBLIC_URL is
# loopback.  Defaults to the host part of BEAUT_HUB_URL.
BEAUT_HUB_ADVERTISE="${BEAUT_HUB_ADVERTISE:-}"
BEAUT_API_TIMEOUT="${BEAUT_API_TIMEOUT:-5}"
BEAUT_API_DOWNLOAD_TIMEOUT="${BEAUT_API_DOWNLOAD_TIMEOUT:-300}"

# ---- worker listener --------------------------------------------------------
BEAUT_WORKER_NAME="${BEAUT_WORKER_NAME:-$(hostname -s 2>/dev/null || printf 'worker')}"
BEAUT_WORKER_BIND="${BEAUT_WORKER_BIND:-0.0.0.0}"
BEAUT_WORKER_PORT="${BEAUT_WORKER_PORT:-8090}"
BEAUT_WORKER_CPUS="${BEAUT_WORKER_CPUS:-}"
BEAUT_WORKER_MEMORY_MB="${BEAUT_WORKER_MEMORY_MB:-}"
BEAUT_WORKER_DISK_MB="${BEAUT_WORKER_DISK_MB:-}"
BEAUT_WORKER_TAGS="${BEAUT_WORKER_TAGS:-}"
BEAUT_WORKER_MAX_SESSIONS="${BEAUT_WORKER_MAX_SESSIONS:-4}"

# ---- packages / caches ------------------------------------------------------
BEAUT_CHUNK_SIZE="${BEAUT_CHUNK_SIZE:-1048576}"
BEAUT_MIN_COPIES="${BEAUT_MIN_COPIES:-2}"
BEAUT_STRICT_COPIES="${BEAUT_STRICT_COPIES:-1}"
BEAUT_MAX_BODY="${BEAUT_MAX_BODY:-1073741824}"
BEAUT_REPLICA_TIMEOUT="${BEAUT_REPLICA_TIMEOUT:-30}"
BEAUT_PROXY_TIMEOUT="${BEAUT_PROXY_TIMEOUT:-30}"

BEAUT_PACKAGE_KINDS=(
  data
  resource
  oci-image
  session-image
  session-state
  web-cache
  artifact
  manifest
)
BEAUT_PACKAGE_KIND_DEFAULT="${BEAUT_PACKAGE_KIND_DEFAULT:-data}"
BEAUT_PACKAGE_KIND_SESSION_IMAGE="${BEAUT_PACKAGE_KIND_SESSION_IMAGE:-session-image}"

# ---- routes -----------------------------------------------------------------
BEAUT_ROUTE_MODES=(http tcp)
BEAUT_ROUTE_MODE_DEFAULT="${BEAUT_ROUTE_MODE_DEFAULT:-http}"
BEAUT_ROUTER_INTERVAL="${BEAUT_ROUTER_INTERVAL:-1}"

# ---- sessions / Docker ------------------------------------------------------
BEAUT_DOCKER="${BEAUT_DOCKER:-docker}"
BEAUT_SESSION_DOMAIN="${BEAUT_SESSION_DOMAIN:-sessions.localhost}"
BEAUT_SESSION_PORT="${BEAUT_SESSION_PORT:-8080}"
BEAUT_SESSION_PROTOCOL="${BEAUT_SESSION_PROTOCOL:-http}"
BEAUT_SESSION_CPUS="${BEAUT_SESSION_CPUS:-}"
BEAUT_SESSION_MEMORY_MB="${BEAUT_SESSION_MEMORY_MB:-}"
BEAUT_SESSION_SNAPSHOT_ON_STOP="${BEAUT_SESSION_SNAPSHOT_ON_STOP:-1}"

# ---- HTTP status values -----------------------------------------------------
BEAUT_HTTP_OK="${BEAUT_HTTP_OK:-200}"
BEAUT_HTTP_CREATED="${BEAUT_HTTP_CREATED:-201}"
BEAUT_HTTP_ACCEPTED="${BEAUT_HTTP_ACCEPTED:-202}"
BEAUT_HTTP_NO_CONTENT="${BEAUT_HTTP_NO_CONTENT:-204}"
BEAUT_HTTP_BAD_REQUEST="${BEAUT_HTTP_BAD_REQUEST:-400}"
BEAUT_HTTP_UNAUTHORIZED="${BEAUT_HTTP_UNAUTHORIZED:-401}"
BEAUT_HTTP_FORBIDDEN="${BEAUT_HTTP_FORBIDDEN:-403}"
BEAUT_HTTP_NOT_FOUND="${BEAUT_HTTP_NOT_FOUND:-404}"
BEAUT_HTTP_METHOD_NOT_ALLOWED="${BEAUT_HTTP_METHOD_NOT_ALLOWED:-405}"
BEAUT_HTTP_CONFLICT="${BEAUT_HTTP_CONFLICT:-409}"
BEAUT_HTTP_PAYLOAD_TOO_LARGE="${BEAUT_HTTP_PAYLOAD_TOO_LARGE:-413}"
BEAUT_HTTP_UNSUPPORTED_MEDIA_TYPE="${BEAUT_HTTP_UNSUPPORTED_MEDIA_TYPE:-415}"
BEAUT_HTTP_TOO_MANY_REQUESTS="${BEAUT_HTTP_TOO_MANY_REQUESTS:-429}"
BEAUT_HTTP_INTERNAL_SERVER_ERROR="${BEAUT_HTTP_INTERNAL_SERVER_ERROR:-500}"
BEAUT_HTTP_NOT_IMPLEMENTED="${BEAUT_HTTP_NOT_IMPLEMENTED:-501}"
BEAUT_HTTP_BAD_GATEWAY="${BEAUT_HTTP_BAD_GATEWAY:-502}"
BEAUT_HTTP_SERVICE_UNAVAILABLE="${BEAUT_HTTP_SERVICE_UNAVAILABLE:-503}"
BEAUT_HTTP_INSUFFICIENT_STORAGE="${BEAUT_HTTP_INSUFFICIENT_STORAGE:-507}"
BEAUT_HTTP_REASON_DEFAULT="${BEAUT_HTTP_REASON_DEFAULT:-OK}"

declare -A BEAUT_HTTP_REASONS=(
  [200]='OK'
  [201]='Created'
  [202]='Accepted'
  [204]='No Content'
  [301]='Moved Permanently'
  [302]='Found'
  [304]='Not Modified'
  [400]='Bad Request'
  [401]='Unauthorized'
  [403]='Forbidden'
  [404]='Not Found'
  [405]='Method Not Allowed'
  [409]='Conflict'
  [413]='Payload Too Large'
  [415]='Unsupported Media Type'
  [429]='Too Many Requests'
  [500]='Internal Server Error'
  [501]='Not Implemented'
  [502]='Bad Gateway'
  [503]='Service Unavailable'
  [507]='Insufficient Storage'
)

# ---- common protocol messages ----------------------------------------------
BEAUT_MSG_BAD_REQUEST="${BEAUT_MSG_BAD_REQUEST:-bad request}"
BEAUT_MSG_NOT_FOUND="${BEAUT_MSG_NOT_FOUND:-not found}"
BEAUT_MSG_METHOD_NOT_ALLOWED="${BEAUT_MSG_METHOD_NOT_ALLOWED:-method not allowed}"
BEAUT_MSG_INVALID_JSON="${BEAUT_MSG_INVALID_JSON:-invalid JSON body}"
BEAUT_MSG_REQUEST_TOO_LARGE="${BEAUT_MSG_REQUEST_TOO_LARGE:-request body too large}"
BEAUT_MSG_PACKAGE_NOT_FOUND="${BEAUT_MSG_PACKAGE_NOT_FOUND:-package not found}"
BEAUT_MSG_SESSION_NOT_FOUND="${BEAUT_MSG_SESSION_NOT_FOUND:-session not found}"
BEAUT_MSG_UPSTREAM_UNREACHABLE="${BEAUT_MSG_UPSTREAM_UNREACHABLE:-upstream unreachable}"

# ---- registry defaults ------------------------------------------------------
if ! declare -p BEAUT_WORKERS >/dev/null 2>&1; then
  BEAUT_WORKERS=()
fi
if ! declare -p BEAUT_ROUTES >/dev/null 2>&1; then
  BEAUT_ROUTES=()
fi
